name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ─────────────────────────────────────────
  # Tạo GitHub Release trước, 3 job build sẽ upload vào đây
  # ─────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Create GitHub Release
        id: create_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              draft: true,
              prerelease: false,
            });
            core.setOutput('id', release.data.id);

  # ─────────────────────────────────────────
  # Windows build
  # ─────────────────────────────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout app-builder
        uses: actions/checkout@v4
        with:
          path: app-builder

      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          repository: leandix-ai/editor-extension
          token: ${{ secrets.GH_TOKEN }}
          path: extension

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install app-builder dependencies
        working-directory: app-builder
        run: npm ci

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build app
        working-directory: app-builder
        run: npm run build:electron

      - name: Package & publish Windows installer
        working-directory: app-builder
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: npx electron-builder --win --publish always

  # ─────────────────────────────────────────
  # macOS build
  # ─────────────────────────────────────────
  build-mac:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout app-builder
        uses: actions/checkout@v4
        with:
          path: app-builder

      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          repository: leandix-ai/editor-extension
          token: ${{ secrets.GH_TOKEN }}
          path: extension

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install app-builder dependencies
        working-directory: app-builder
        run: npm ci

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build app
        working-directory: app-builder
        run: npm run build:electron

      - name: Package & publish macOS installer
        working-directory: app-builder
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: npx electron-builder --mac --publish always

  # ─────────────────────────────────────────
  # Linux build
  # ─────────────────────────────────────────
  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-builder
        uses: actions/checkout@v4
        with:
          path: app-builder

      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          repository: leandix-ai/editor-extension
          token: ${{ secrets.GH_TOKEN }}
          path: extension

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install app-builder dependencies
        working-directory: app-builder
        run: npm ci

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build app
        working-directory: app-builder
        run: npm run build:electron

      - name: Package & publish Linux installer
        working-directory: app-builder
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: npx electron-builder --linux --publish always
  # ─────────────────────────────────────────
  # Download to Server
  # ─────────────────────────────────────────
  download-artifacts:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # electron-builder --publish always đẩy file lên GitHub Release (không phải Actions artifacts)
      # nên phải dùng gh CLI để tải asset từ Release thay vì actions/download-artifact
      - name: Download release assets via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --dir artifacts/ \
            --skip-existing

      - name: Show downloaded files (debug)
        run: find artifacts/ -type f | sort

      - name: SCP artifacts to Atlas VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ATLAS_VPS_HOST }}
          username: ${{ secrets.ATLAS_VPS_USER }}
          key: ${{ secrets.ATLAS_VPS_SSH_KEY }}
          source: "artifacts"
          target: "/home/atlasagent/leandixagent/downloads/_incoming"

      - name: Run sync script on Atlas VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ATLAS_VPS_HOST }}
          username: ${{ secrets.ATLAS_VPS_USER }}
          key: ${{ secrets.ATLAS_VPS_SSH_KEY }}
          command: "/home/atlasagent/leandixagent/downloads/sync-from-incoming.sh ${{ steps.version.outputs.version }}"

      - name: Verify on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ATLAS_VPS_HOST }}
          username: ${{ secrets.ATLAS_VPS_USER }}
          key: ${{ secrets.ATLAS_VPS_SSH_KEY }}
          command: |
            ls -la /home/atlasagent/leandixagent/downloads/{windows,macos,linux}/
            echo "---"
            readlink /home/atlasagent/leandixagent/downloads/windows/latest.exe
            readlink /home/atlasagent/leandixagent/downloads/macos/latest.dmg
            readlink /home/atlasagent/leandixagent/downloads/linux/latest.deb